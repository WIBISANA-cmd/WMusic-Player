services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: pulse-music-api
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - CORS_ORIGIN=http://localhost:3000
      - MEDIA_STORAGE_PATH=/app/media
    volumes:
      - pulse_media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: pulse-music-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_INTERNAL_URL=http://api:4000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pulse_media:
    driver: local
