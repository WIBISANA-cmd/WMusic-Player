# Production Nginx Reverse Proxy Configuration for Pulse Music API
# Optimized for HTTP Range audio streaming, low latency, and PWA reliability

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format custom '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time ut=$upstream_response_time';

    access_log /var/log/nginx/access.log custom;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Rate limiting zone (10 requests/sec per IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

    # Upstream Node.js Long-Running Container
    upstream music_api_upstream {
        server api:4000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name api.music.example.com;

        # Redirect plain HTTP to HTTPS in production
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name api.music.example.com;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/api.music.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.music.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # General API Endpoints
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://music_api_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # CRITICAL AUDIO STREAMING CONFIGURATION (/api/v1/stream/ or /api/stream/)
        location ~ ^/api/(v1/)?stream/ {
            proxy_pass http://music_api_upstream;
            proxy_http_version 1.1;

            # 1. DISABLE BUFFERING: Stream audio bytes directly to the client without buffering in Nginx
            proxy_buffering off;
            proxy_request_buffering off;

            # 2. PRESERVE RFC RANGE HEADERS: Essential for seekable 206 Partial Content audio
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_pass_header Accept-Ranges;
            proxy_pass_header Content-Range;
            proxy_pass_header Content-Length;

            # 3. DO NOT COMPRESS OR TRANSFORM AUDIO
            gzip off;

            # 4. PRACTICAL TIMEOUTS FOR EXTENDED AUDIO STREAMING SESSIONS
            proxy_connect_timeout 15s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            # Standard Forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Health Check Bypass
        location = /health {
            proxy_pass http://music_api_upstream/health;
            access_log off;
        }

        location = /api/v1/health {
            proxy_pass http://music_api_upstream/api/v1/health;
            access_log off;
        }
    }
}

