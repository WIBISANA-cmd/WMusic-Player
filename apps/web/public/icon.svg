<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#151d30"/>
      <stop offset="100%" stop-color="#2d124d"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Outer Neon Glow Ring -->
  <circle cx="256" cy="256" r="180" stroke="url(#neonGrad)" stroke-width="6" fill="none" opacity="0.35"/>

  <!-- Soundwave Bars / Pulse Centerpiece -->
  <g filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="136" y="216" width="24" height="80" rx="12" fill="url(#neonGrad)"/>
    <!-- Bar 2 -->
    <rect x="184" y="160" width="24" height="192" rx="12" fill="url(#neonGrad)"/>
    <!-- Bar 3 (Center High) -->
    <rect x="232" y="104" width="24" height="304" rx="12" fill="url(#neonGrad)"/>
    <!-- Bar 4 (Play Pulse) -->
    <rect x="280" y="144" width="24" height="224" rx="12" fill="url(#neonGrad)"/>
    <!-- Bar 5 -->
    <rect x="328" y="192" width="24" height="128" rx="12" fill="url(#neonGrad)"/>
    <!-- Bar 6 -->
    <rect x="376" y="232" width="24" height="48" rx="12" fill="url(#neonGrad)"/>
  </g>
</svg>
